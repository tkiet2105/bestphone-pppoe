<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>bestphone-pppoe — login</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-box">
    <h1>bestphone-pppoe</h1>
    <form id="login-form">
      <div class="form-row">
        <label for="token">Admin token</label>
        <input type="password" id="token" required autocomplete="off" autofocus>
      </div>
      <button type="submit">Đăng nhập</button>
    </form>
    <p class="muted small" style="margin-top:16px">
      Token in ra cuối install hoặc lưu trong <span class="mono">/etc/default/bestphone-pppoe</span>
    </p>
  </div>
  <script src="/js/api-client.js"></script>
  <script>
    if (Api.getToken()) {
      // already logged in — verify, redirect
      Api.health().then(() => location.href = '/lines.html').catch(() => Api.clearToken());
    }
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const tok = document.getElementById('token').value.trim();
      if (!tok) return;
      try {
        const r = await Api.login(tok);
        if (!r.success) {
          Toast.error(r.error || 'login failed');
          return;
        }
        Api.setToken(tok);
        Toast.success('Đăng nhập OK');
        setTimeout(() => location.href = '/lines.html', 400);
      } catch (err) {
        Toast.error('Lỗi: ' + err.message);
      }
    });
  </script>
</body>
</html>
