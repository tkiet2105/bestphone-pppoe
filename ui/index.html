<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập — bestphone-pppoe</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-box">
    <h1>bestphone-pppoe</h1>
    <form id="login-form">
      <div class="form-row">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" required autocomplete="username" autofocus>
      </div>
      <div class="form-row">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit">Đăng nhập</button>
    </form>
    <p class="muted small" style="margin-top:16px">
      Mặc định lần đầu: <span class="mono">admin</span> / <span class="mono">bestphone</span>.
      Sau khi đăng nhập, vào trang <b>Cài đặt</b> để đổi mật khẩu.
    </p>
  </div>
  <script src="/js/api-client.js"></script>
  <script>
    if (Api.getToken()) {
      // Đã có token — verify, redirect
      Api.health().then(() => location.href = '/lines.html').catch(() => Api.clearToken());
    }
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return;
      try {
        const r = await Api.login(username, password);
        if (!r.success) {
          Toast.error(r.error || 'Đăng nhập thất bại');
          return;
        }
        Api.setToken(r.data.token);
        Toast.success('Đăng nhập thành công');
        setTimeout(() => location.href = '/lines.html', 400);
      } catch (err) {
        Toast.error('Lỗi: ' + err.message);
      }
    });
  </script>
</body>
</html>
