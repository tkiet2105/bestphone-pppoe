server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/bestphone-pppoe;
    index index.html;

    client_max_body_size 4M;
    access_log /var/log/nginx/bestphone-pppoe.access.log;
    error_log  /var/log/nginx/bestphone-pppoe.error.log;

    # API → Go backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE keepalive — disable buffering + dài timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Static UI — disable cache cho HTML/JS/CSS để Việt hóa / hotfix luôn hiện
    # ngay khi user reload (trang quản trị nội bộ, không cần CDN/cache).
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
